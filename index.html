<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile App Shell</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="loader.js"></script>
</head>
<body onload="load()">

    <!-- Main Device Wrapper to restrict width on desktop views -->
    <div class="app-container">
        
        <!-- Fixed App Header -->
        <header class="app-header">

            <h1 class="app-title">Dashboard</h1>

        </header>

        <!-- Main Scrollable Feed Box -->
        <main class="app-content">
            
            <div class="welcome-banner">
                <h2>Welcome Back!</h2>
                <p>Find/Rate EV Chargers.</p>
            </div>

            <!-- UI Action Cards -->
            <div class="card-grid">
                <div class="app-card">
                    <span class="card-icon">⚡</span>
                    <h3>Nearest Charger</h3>
                    <p>Sorry! Not Enough Data 😟</p>
                </div>
                <div class="napp-card">
                    <span class="card-icon">❤️</span>
                    <h3>Favourites</h3>
                </div>
                <div class="napp-card">
                    <span class="card-icon">⭐</span>
                    <h3>Find & <I>Rate</I></h3>
                </div>
                <div class="app-card" onclick="window.location.href = `map.html`">
                    <span class="card-icon">🗺</span>
                    <h3>Discover</h3>
                    <p><i>(Quick Start)</i></p>
                </div>
            </div>

        </main>

        <!-- Fixed Bottom Navigation Bar -->
        <nav class="app-nav" id="nav-dummy">
        </nav>

    </div>

</body>
</html>
